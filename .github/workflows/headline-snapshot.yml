name: Refresh headline snapshot

on:
  # Hourly schedule removed Nov 17, 2026: the site no longer shows third-party headline feeds
  # (FEEDS in assets/agn.js is empty), so the job only failed every hour. Manual runs still work.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_videos.py'
      - '.github/workflows/headline-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: headline-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data/feeds.json
        run: python .github/scripts/build_feeds.py
      - name: Build data/videos.json
        run: python .github/scripts/build_videos.py || true
      - name: Commit snapshot
        run: |
          git config user.name "agn-feed-bot"
          git config user.email "agn-feed-bot@users.noreply.github.com"
          git add data/feeds.json; if [ -f data/videos.json ]; then git add data/videos.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Refresh headline snapshot"
          git pull --rebase origin main
          git push
